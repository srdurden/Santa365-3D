<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fábrica de regalos</title>
  <style>
    :root {
      --cream-bg: #f6ead2;
      --cream-panel: #fff1d2;
      --cream-line: #d3b16f;
      --brown-text: #4a2b16;
      --button-bg: #d58b34;
      --button-bg-hover: #e29d4b;
      --button-shadow: #8a4e1f;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--cream-bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--brown-text);
    }

    #topHud {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      height: 76px;
      z-index: 10;
      pointer-events: none;
    }

    #gameTitle {
      position: absolute;
      left: 28px;
      top: 18px;
      font-size: clamp(32px, 4vw, 54px);
      line-height: 1;
      letter-spacing: -0.06em;
      font-weight: 850;
      color: #4a2b16;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.55);
    }

    #dayCounter {
      position: absolute;
      right: 34px;
      top: 26px;
      font-size: 18px;
      line-height: 1;
      font-weight: 650;
      letter-spacing: 0.03em;
      color: #5b3a20;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    #resourceHud {
      position: absolute;
      right: 148px;
      top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 105px;
      padding: 10px 15px;
      border: 2px solid rgba(92, 55, 24, 0.18);
      border-radius: 18px;
      background: rgba(255, 244, 213, 0.9);
      box-shadow: 0 5px 0 rgba(116, 72, 30, 0.22);
      color: #5d351b;
      font-size: 17px;
      font-weight: 850;
    }

    .woodIcon {
      width: 30px;
      height: 18px;
      border-radius: 8px;
      background: #9a5b28;
      box-shadow: inset 0 -4px 0 #6d3b1c, inset 5px 0 0 rgba(255,255,255,0.12);
      transform: rotate(-8deg);
    }

    #actionHint {
      position: fixed;
      left: calc((100% - 330px) / 2);
      bottom: 24px;
      z-index: 12;
      transform: translate(-50%, 12px);
      padding: 11px 17px;
      border-radius: 16px;
      background: rgba(63, 39, 22, 0.9);
      color: #fff7dd;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease, transform 140ms ease;
    }

    #actionHint.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #gameHost {
      position: fixed;
      left: 0;
      top: 76px;
      bottom: 0;
      right: 330px;
      overflow: hidden;
      background: var(--cream-bg);
    }

    #sidePanel {
      position: fixed;
      top: 76px;
      right: 0;
      bottom: 0;
      width: 330px;
      box-sizing: border-box;
      padding: 26px 24px;
      background: linear-gradient(180deg, #fff1d2 0%, #f5dfad 100%);
      border-left: 2px solid rgba(150, 103, 45, 0.18);
      box-shadow: inset 10px 0 22px rgba(107, 65, 20, 0.08);
      z-index: 9;
    }

    .sideButton {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 16px;
      background: var(--button-bg);
      box-shadow: 0 6px 0 var(--button-shadow), 0 14px 24px rgba(102, 59, 20, 0.18);
      color: #fff9e9;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-transform: lowercase;
      margin-bottom: 16px;
    }

    .sideButton:hover {
      background: var(--button-bg-hover);
      transform: translateY(1px);
      box-shadow: 0 5px 0 var(--button-shadow), 0 12px 20px rgba(102, 59, 20, 0.16);
    }

    .sideButton:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 var(--button-shadow), 0 6px 12px rgba(102, 59, 20, 0.12);
    }

    #buildPopup {
      position: fixed;
      top: 154px;
      right: 24px;
      width: 282px;
      max-height: calc(100vh - 190px);
      box-sizing: border-box;
      padding: 18px;
      border-radius: 22px;
      background: rgba(255, 244, 213, 0.96);
      border: 2px solid rgba(141, 92, 34, 0.28);
      box-shadow: 0 18px 38px rgba(97, 56, 18, 0.26), inset 0 2px 0 rgba(255,255,255,0.55);
      z-index: 20;
      opacity: 0;
      transform: translateY(-8px) scale(0.98);
      pointer-events: none;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    #buildPopup.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .buildGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .buildOption {
      height: 74px;
      border: 0;
      border-radius: 16px;
      background: #e6bd78;
      box-shadow: 0 5px 0 #9b642a, 0 12px 18px rgba(102, 59, 20, 0.12);
      color: #4a2b16;
      font-size: 16px;
      font-weight: 850;
      cursor: pointer;
    }

    .buildOption:hover {
      background: #efcb8a;
      transform: translateY(1px);
      box-shadow: 0 4px 0 #9b642a, 0 10px 16px rgba(102, 59, 20, 0.12);
    }

    .buildOption:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #9b642a, 0 5px 10px rgba(102, 59, 20, 0.1);
    }

    .buildOption[aria-disabled="true"] {
      background: #cdb98f;
      color: #725d3f;
      box-shadow: 0 5px 0 #8d7955, 0 12px 18px rgba(102, 59, 20, 0.08);
    }

    .buildOptionLabel,
    .buildOptionCost {
      display: block;
    }

    .buildOptionCost {
      margin-top: 5px;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    #buildMessage {
      min-height: 18px;
      margin: 14px 4px 0;
      color: #9f341f;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .buildPlaceholder {
      height: 74px;
      border-radius: 16px;
      background: rgba(141, 92, 34, 0.10);
      border: 2px dashed rgba(141, 92, 34, 0.18);
    }

    #inventoryMount {
      width: 100%;
      height: min(520px, calc(100vh - 176px));
      margin-top: 8px;
      border-radius: 22px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px) scale(0.98);
      pointer-events: none;
      transition: opacity 150ms ease, transform 150ms ease;
      filter: drop-shadow(0 18px 26px rgba(97, 56, 18, 0.22));
    }

    #inventoryMount.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #inventoryMount canvas {
      border-radius: 22px;
      cursor: default;
    }

    @media (max-width: 900px) {
      #gameHost {
        right: 240px;
      }
      #sidePanel {
        width: 240px;
        padding: 22px 16px;
      }
      #dayCounter {
        right: 24px;
      }
      #resourceHud {
        right: 120px;
      }
      #actionHint {
        left: calc((100% - 240px) / 2);
      }
      #buildPopup {
        right: 16px;
        width: 208px;
      }
      .buildGrid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="topHud">
    <div id="gameTitle">365 days</div>
    <div id="resourceHud" aria-label="Madera recogida"><span class="woodIcon"></span><span id="woodCount">0</span></div>
    <div id="dayCounter">1 / 365</div>
  </div>
  <main id="gameHost" aria-label="Escenario 3D"></main>
  <div id="actionHint" role="status" aria-live="polite">Pulsa E o espacio para talar</div>
  <aside id="sidePanel">
    <button id="inventoryButton" class="sideButton" type="button">inventario</button>
    <button id="buildButton" class="sideButton" type="button">construir</button>
    <div id="inventoryMount" aria-label="Inventario 3D"></div>
  </aside>
  <div id="buildPopup" aria-label="Construir">
    <div class="buildGrid">
      <button class="buildOption" type="button" data-build="cama" data-cost="10" aria-label="Construir cama, cuesta 10 bloques de madera">
        <span class="buildOptionLabel">Cama</span>
        <span class="buildOptionCost">🪵 10 madera</span>
      </button>
      <div class="buildPlaceholder" aria-hidden="true"></div>
      <div class="buildPlaceholder" aria-hidden="true"></div>
      <div class="buildPlaceholder" aria-hidden="true"></div>
      <div class="buildPlaceholder" aria-hidden="true"></div>
      <div class="buildPlaceholder" aria-hidden="true"></div>
    </div>
    <div id="buildMessage" role="status" aria-live="polite"></div>
  </div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6ead2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const gameHost = document.getElementById('gameHost');
const sidePanel = document.getElementById('sidePanel');
const inventoryButton = document.getElementById('inventoryButton');
const buildButton = document.getElementById('buildButton');
const buildPopup = document.getElementById('buildPopup');
const buildMessage = document.getElementById('buildMessage');
const inventoryMount = document.getElementById('inventoryMount');
const woodCountElement = document.getElementById('woodCount');
const actionHint = document.getElementById('actionHint');
renderer.setSize(gameHost.clientWidth, gameHost.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
gameHost.appendChild(renderer.domElement);

const camera = new THREE.OrthographicCamera(-24, 24, 16, -16, 0.1, 200);
camera.position.set(0, 38, 31);
camera.lookAt(0, 0, 0);

const hemi = new THREE.HemisphereLight(0xfff4dc, 0x3a2a1a, 2.35);
scene.add(hemi);

const dir = new THREE.DirectionalLight(0xfff1d0, 3.0);
dir.position.set(-10, 22, 14);
dir.castShadow = true;
dir.shadow.mapSize.width = 2048;
dir.shadow.mapSize.height = 2048;
dir.shadow.camera.left = -32;
dir.shadow.camera.right = 32;
dir.shadow.camera.top = 24;
dir.shadow.camera.bottom = -24;
dir.shadow.camera.near = 1;
dir.shadow.camera.far = 70;
scene.add(dir);
scene.add(dir.target);

const ROOM = {
  minX: -22,
  maxX: 22,
  minZ: -16,
  maxZ: 19
};

const matFloor = new THREE.MeshStandardMaterial({ color: 0xa94910, roughness: 0.82 });
const matWall = new THREE.MeshStandardMaterial({ color: 0xc59b5d, roughness: 0.76 });
const matWood = new THREE.MeshStandardMaterial({ color: 0xa7662a, roughness: 0.72 });
const matWoodDark = new THREE.MeshStandardMaterial({ color: 0x6a3f1d, roughness: 0.78 });
const matCream = new THREE.MeshStandardMaterial({ color: 0xe8c697, roughness: 0.66 });
const matWhite = new THREE.MeshStandardMaterial({ color: 0xf3ead9, roughness: 0.55 });
const matRed = new THREE.MeshStandardMaterial({ color: 0xd22a22, roughness: 0.58 });
const matGreen = new THREE.MeshStandardMaterial({ color: 0x1c9a5a, roughness: 0.6 });
const matBlack = new THREE.MeshStandardMaterial({ color: 0x171313, roughness: 0.62 });
const matGlass = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffd89a, emissiveIntensity: 0.72, roughness: 0.25 });
const matGrass = new THREE.MeshStandardMaterial({ color: 0x6f9b48, roughness: 0.98 });
const matGrassLight = new THREE.MeshStandardMaterial({ color: 0x8bb85d, roughness: 1 });
const matSnow = new THREE.MeshStandardMaterial({ color: 0xe9f0df, roughness: 0.92 });
const matTreeTrunk = new THREE.MeshStandardMaterial({ color: 0x74431f, roughness: 0.9 });
const matTreeCut = new THREE.MeshStandardMaterial({ color: 0xd7a663, roughness: 0.84 });
const matPineDark = new THREE.MeshStandardMaterial({ color: 0x17603b, roughness: 0.92 });
const matPine = new THREE.MeshStandardMaterial({ color: 0x258052, roughness: 0.9 });
const matRock = new THREE.MeshStandardMaterial({ color: 0x778078, roughness: 1 });
const matBush = new THREE.MeshStandardMaterial({ color: 0x3f7842, roughness: 1 });
const matSkin = new THREE.MeshStandardMaterial({ color: 0xf2b58b, roughness: 0.72 });
const matBeard = new THREE.MeshStandardMaterial({ color: 0xfffaf0, roughness: 0.86 });
const matGold = new THREE.MeshStandardMaterial({ color: 0xf4ba3b, metalness: 0.35, roughness: 0.42 });
const matLeather = new THREE.MeshStandardMaterial({ color: 0x35231d, roughness: 0.82 });
const matSack = new THREE.MeshStandardMaterial({ color: 0x8f5228, roughness: 0.94 });

const matSelection = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.28,
  side: THREE.DoubleSide,
  depthTest: false,
  depthWrite: false
});

const matFootprint = new THREE.MeshBasicMaterial({
  color: 0x000000,
  transparent: true,
  opacity: 0.46,
  side: THREE.DoubleSide,
  depthTest: false,
  depthWrite: false
});

const matFootprintLine = new THREE.LineBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.98,
  depthTest: false,
  depthWrite: false
});

const movingMaterialCache = new Map();

function box(name, size, pos, material, parent = scene, cast = true, receive = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, size.z), material);
  mesh.name = name;
  mesh.position.set(pos.x, pos.y, pos.z);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  parent.add(mesh);
  return mesh;
}

function sphere(name, radius, scale, pos, material, parent = scene) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 18, 14), material);
  mesh.name = name;
  mesh.scale.set(scale.x, scale.y, scale.z);
  mesh.position.set(pos.x, pos.y, pos.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function cylinder(name, radiusTop, radiusBottom, height, pos, material, parent = scene, segments = 18) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments), material);
  mesh.name = name;
  mesh.position.set(pos.x, pos.y, pos.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

const floor = new THREE.Mesh(new THREE.PlaneGeometry(44, 35), matFloor);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.position.z = 1.5;
floor.receiveShadow = true;
floor.name = 'floor';
scene.add(floor);

const WORLD = { minX: -23, maxX: 104, minZ: -48, maxZ: 48 };
const DOOR = { minZ: -0.85, maxZ: 4.35 };
const outdoorGround = new THREE.Mesh(new THREE.PlaneGeometry(82, 96), matGrass);
outdoorGround.rotation.x = -Math.PI / 2;
outdoorGround.position.set(63, -0.035, 0);
outdoorGround.receiveShadow = true;
outdoorGround.name = 'procedural-outdoor-ground';
scene.add(outdoorGround);

// Camino que conecta de forma clara la puerta del taller con el bosque.
box('door-threshold', { x: 2.3, y: 0.14, z: 4.4 }, { x: 22.8, y: 0.04, z: 1.75 }, matWoodDark, scene, true, true);
const path = new THREE.Mesh(new THREE.PlaneGeometry(31, 4.3), matSnow);
path.rotation.x = -Math.PI / 2;
path.position.set(38.5, 0.015, 1.75);
path.receiveShadow = true;
scene.add(path);

const treeRoots = [];
const treeMeshes = [];
const BUILD_COSTS = { cama: 10 };
let woodCount = 0;
let activeTree = null;
let chopCooldown = 0;
let axeSwing = 0;

function seededRandom(seed = 365) {
  let state = seed >>> 0;
  return () => {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  };
}

function makeTree(x, z, scale = 1) {
  const tree = new THREE.Group();
  tree.position.set(x, 0, z);
  tree.userData.isTree = true;
  tree.userData.health = 3;
  tree.userData.wood = Math.max(2, Math.round(3 * scale));
  tree.userData.radius = 0.72 * scale;

  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.42 * scale, 0.56 * scale, 3.2 * scale, 8), matTreeTrunk);
  trunk.position.y = 1.6 * scale;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  tree.add(trunk);

  for (let level = 0; level < 3; level++) {
    const crown = new THREE.Mesh(
      new THREE.ConeGeometry((1.85 - level * 0.3) * scale, 2.6 * scale, 9),
      level % 2 ? matPine : matPineDark
    );
    crown.position.y = (3.0 + level * 1.25) * scale;
    crown.castShadow = true;
    crown.receiveShadow = true;
    tree.add(crown);
  }

  tree.traverse(obj => {
    if (obj.isMesh) {
      obj.userData.treeRoot = tree;
      treeMeshes.push(obj);
    }
  });
  treeRoots.push(tree);
  scene.add(tree);
  return tree;
}

function makeNature() {
  const random = seededRandom(365);
  // Un bosque reproducible: cada recarga conserva el mismo mapa procedural.
  let planted = 0;
  for (let attempt = 0; attempt < 180 && planted < 72; attempt++) {
    const x = 27 + random() * 73;
    const z = WORLD.minZ + 3 + random() * (WORLD.maxZ - WORLD.minZ - 6);
    if (x < 57 && Math.abs(z - 1.75) < 4.5) continue;
    if (treeRoots.some(tree => tree.position.distanceToSquared(new THREE.Vector3(x, 0, z)) < 7.5)) continue;
    makeTree(x, z, 0.72 + random() * 0.5);
    planted += 1;
  }

  for (let i = 0; i < 42; i++) {
    const x = 25 + random() * 76;
    const z = WORLD.minZ + 2 + random() * (WORLD.maxZ - WORLD.minZ - 4);
    if (x < 57 && Math.abs(z - 1.75) < 3.2) continue;
    const bush = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45 + random() * 0.48, 0), matBush);
    bush.position.set(x, 0.42, z);
    bush.scale.y = 0.65;
    bush.castShadow = true;
    bush.receiveShadow = true;
    scene.add(bush);
  }

  for (let i = 0; i < 24; i++) {
    const x = 26 + random() * 74;
    const z = WORLD.minZ + 2 + random() * (WORLD.maxZ - WORLD.minZ - 4);
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35 + random() * 0.5, 0), matRock);
    rock.position.set(x, 0.24, z);
    rock.scale.set(1.2, 0.62, 0.9);
    rock.rotation.y = random() * Math.PI;
    rock.castShadow = true;
    rock.receiveShadow = true;
    scene.add(rock);
  }

  for (let i = 0; i < 18; i++) {
    const patch = new THREE.Mesh(new THREE.CircleGeometry(1.2 + random() * 2.2, 18), i % 3 ? matGrassLight : matSnow);
    patch.rotation.x = -Math.PI / 2;
    patch.position.set(29 + random() * 70, 0.005, WORLD.minZ + 4 + random() * (WORLD.maxZ - WORLD.minZ - 8));
    patch.scale.x = 0.55 + random();
    patch.receiveShadow = true;
    scene.add(patch);
  }
}
makeNature();

function wallSegment(name, x, z, sx, sz) {
  box(name, { x: sx, y: 2.35, z: sz }, { x, y: 1.175, z }, matWall, scene, true, true);
}

wallSegment('top-wall', 0, -16.55, 45, 1.1);
wallSegment('left-wall', -22.55, 0, 1.1, 33.1);
wallSegment('right-wall-top', 22.55, -8.7, 1.1, 15.6);
wallSegment('right-wall-bottom', 22.55, 10.2, 1.1, 11.6);

box('top-cap', { x: 45.4, y: 0.28, z: 1.22 }, { x: 0, y: 2.48, z: -16.55 }, matCream, scene, true, true);
box('left-cap', { x: 1.22, y: 0.28, z: 33.2 }, { x: -22.55, y: 2.48, z: 0 }, matCream, scene, true, true);
box('right-cap-top', { x: 1.22, y: 0.28, z: 15.6 }, { x: 22.55, y: 2.48, z: -8.7 }, matCream, scene, true, true);
box('right-cap-bottom', { x: 1.22, y: 0.28, z: 11.6 }, { x: 22.55, y: 2.48, z: 10.2 }, matCream, scene, true, true);

function makeWindow(x) {
  const g = new THREE.Group();
  g.position.set(x, 2.0, -16.15);
  box('window-frame', { x: 1.45, y: 1.05, z: 0.18 }, { x: 0, y: 0, z: 0 }, matWoodDark, g, true, true);
  box('window-light', { x: 1.06, y: 0.72, z: 0.22 }, { x: 0, y: 0.02, z: -0.02 }, matGlass, g, false, false);
  box('window-cross-v', { x: 0.12, y: 0.78, z: 0.27 }, { x: 0, y: 0.02, z: -0.04 }, matWoodDark, g, true, true);
  box('window-cross-h', { x: 1.1, y: 0.12, z: 0.27 }, { x: 0, y: 0.02, z: -0.04 }, matWoodDark, g, true, true);
  scene.add(g);
}
makeWindow(-9.4);
makeWindow(3.0);

const furnitureRoots = [];
const furnitureMeshes = [];

function registerFurniture(group, radius = 2, footprintX = null, footprintZ = null) {
  group.userData.isFurnitureRoot = true;
  group.userData.radius = radius;
  group.userData.footprintX = footprintX || radius * 2;
  group.userData.footprintZ = footprintZ || radius * 2;
  furnitureRoots.push(group);
  group.traverse(obj => {
    if (obj.isMesh) {
      obj.userData.furnitureRoot = group;
      furnitureMeshes.push(obj);
    }
  });
  return group;
}

function makeTableSet(position = { x: 0, z: -0.6 }) {
  const g = new THREE.Group();
  g.position.set(position.x, 0, position.z);
  box('table-top', { x: 4.4, y: 0.45, z: 2.6 }, { x: 0, y: 1.05, z: 0 }, matWood, g, true, true);
  box('table-leg-1', { x: 0.35, y: 1.0, z: 0.35 }, { x: -1.7, y: 0.5, z: -0.9 }, matWoodDark, g, true, true);

function invBox(name, size, pos, mat, parent = inventoryScene) {

  mesh.position.set(pos.x, pos.y, pos.z);
  parent.add(mesh);

}

function makeRoundedRectShape(width, height, radius) {
  const x = -width / 2;
  const y = -height / 2;
  const shape = new THREE.Shape();
  shape.moveTo(x + radius, y);
  shape.lineTo(x + width - radius, y);
  shape.quadraticCurveTo(x + width, y, x + width, y + radius);
  shape.lineTo(x + width, y + height - radius);
  shape.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  shape.lineTo(x + radius, y + height);
  shape.quadraticCurveTo(x, y + height, x, y + height - radius);
  shape.lineTo(x, y + radius);
  shape.quadraticCurveTo(x, y, x + radius, y);
  return shape;
}

function invRoundedPlane(name, width, height, radius, mat, z = -0.1, parent = inventoryScene) {
  const mesh = new THREE.Mesh(new THREE.ShapeGeometry(makeRoundedRectShape(width, height, radius)), mat);
  mesh.name = name;
  mesh.position.z = z;
  parent.add(mesh);
  return mesh;
}

function resizeInventoryRenderer() {
  const rect = inventoryMount.getBoundingClientRect();
  const w = Math.max(1, Math.floor(rect.width));
  const h = Math.max(1, Math.floor(rect.height));
  inventoryRenderer.setSize(w, h, false);
  const aspect = w / h;
  const viewHeight = 14;
  inventoryCamera.left = -viewHeight * aspect / 2;
  inventoryCamera.right = viewHeight * aspect / 2;
  inventoryCamera.top = viewHeight / 2;
  inventoryCamera.bottom = -viewHeight / 2;
  inventoryCamera.updateProjectionMatrix();
}

function updateBuildAffordability() {
  for (const button of buildPopup.querySelectorAll('[data-build]')) {
    const cost = BUILD_COSTS[button.dataset.build] || 0;
    button.setAttribute('aria-disabled', String(woodCount < cost));
  }
}

function placeNewFurnitureInMoveMode(kind) {
  const cost = BUILD_COSTS[kind] || 0;
  if (woodCount < cost) {
    buildMessage.textContent = `Necesitas ${cost} bloques de madera (tienes ${woodCount}).`;
    woodCountElement.animate(
      [{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)', color: '#b52d1f' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }],
      { duration: 320, easing: 'ease-out' }
    );
    return;
  }

  if (selectedFurniture) finishFurnitureMove(selectedFurniture.position);

  const start = nearestFreePoint(clampToRoom(santa.position.clone().add(new THREE.Vector3(3.2, 0, 0)), 1.2));
  let root = null;

  if (kind === 'cama') {
    root = makeBed({ x: start.x, z: start.z });
  }

  if (!root) return;
  woodCount -= cost;
  woodCountElement.textContent = woodCount;
  updateBuildAffordability();
  buildMessage.textContent = '';
  setBuildPopupOpen(false);
  beginFurnitureMove(root);
  updateMovingFurniture(start);
}

buildPopup.addEventListener('click', ev => {
  const button = ev.target.closest('[data-build]');
  if (!button) return;
  placeNewFurnitureInMoveMode(button.dataset.build);
});

const elfCollisionRadius = 0.54;
const santaSpeed = 12.4;
const elfSpeed = 9.6;
const keyState = {
  ArrowUp: false,
  ArrowDown: false,
  ArrowLeft: false,
  ArrowRight: false
};

function setPointer(ev) {
  const source = ev.touches ? ev.touches[0] : ev;
  if (!source) return;
  lastPointerClientX = source.clientX;
  lastPointerClientY = source.clientY;
  pointerKnown = true;
}

function clientToGround(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.ray.intersectPlane(groundPlane, groundPoint);
  if (!hit) return null;
  return new THREE.Vector3(groundPoint.x, 0, groundPoint.z);
}

function currentGroundPoint() {
  if (!pointerKnown) return null;
  return clientToGround(lastPointerClientX, lastPointerClientY);
}

function clampToRoom(point, margin = 0.8) {
  return new THREE.Vector3(
    THREE.MathUtils.clamp(point.x, ROOM.minX + margin, ROOM.maxX - margin),
    0,
    THREE.MathUtils.clamp(point.z, ROOM.minZ + margin, ROOM.maxZ - margin)
  );
}

function clampToWorld(point, margin = 0.8) {
  return new THREE.Vector3(
    THREE.MathUtils.clamp(point.x, WORLD.minX + margin, WORLD.maxX - margin),
    0,
    THREE.MathUtils.clamp(point.z, WORLD.minZ + margin, WORLD.maxZ - margin)
  );
}

function pointHitsTree(point, radius, ignoreTree = null) {
  return treeRoots.some(tree => tree !== ignoreTree && tree.visible && !tree.userData.falling &&
    point.distanceToSquared(tree.position) < Math.pow(radius + tree.userData.radius, 2));
}

function getRotatedFootprint(root) {
  const x = root.userData.footprintX || 2;
  const z = root.userData.footprintZ || 2;
  return { x, z };
}

function clampFurniturePoint(root, point) {
  const fp = getRotatedFootprint(root);
  const marginX = Math.max(1.0, Math.min(6.2, fp.x * 0.5));
  const marginZ = Math.max(1.0, Math.min(4.2, fp.z * 0.5));
  return new THREE.Vector3(
    THREE.MathUtils.clamp(point.x, ROOM.minX + marginX, ROOM.maxX - marginX),
    0,
    THREE.MathUtils.clamp(point.z, ROOM.minZ + marginZ, ROOM.maxZ - marginZ)
  );
}

function furnitureObstacleRects(ignoreRoot = null, radius = santaCollisionRadius) {
  return furnitureRoots
    .filter(root => root !== ignoreRoot)
    .map(root => {
      const bounds = new THREE.Box3().setFromObject(root);
      return {
        minX: bounds.min.x - radius,
        maxX: bounds.max.x + radius,
        minZ: bounds.min.z - radius,
        maxZ: bounds.max.z + radius
      };
    });
}

function pointHitsFurniture(point, ignoreRoot = null, radius = santaCollisionRadius) {
  return furnitureObstacleRects(ignoreRoot, radius).some(rect =>
    point.x >= rect.minX && point.x <= rect.maxX &&
    point.z >= rect.minZ && point.z <= rect.maxZ
  );
}

function nearestFreePoint(point) {
  if (!pointHitsFurniture(point)) return point.clone();

  const angleSteps = 48;
  const radiusStep = 0.35;
  for (let radius = radiusStep; radius <= 8; radius += radiusStep) {
    for (let i = 0; i < angleSteps; i++) {
      const angle = (Math.PI * 2 * i) / angleSteps;
      const candidate = clampToRoom(new THREE.Vector3(
        point.x + Math.cos(angle) * radius,
        0,
        point.z + Math.sin(angle) * radius
      ), 0.85);
      if (!pointHitsFurniture(candidate)) return candidate;
    }
  }
  return santa.position.clone();
}

function canCharacterStandAt(point, radius = santaCollisionRadius) {
  const margin = Math.max(0.65, radius + 0.16);
  const withinWorld =
    point.x >= WORLD.minX + margin && point.x <= WORLD.maxX - margin &&
    point.z >= WORLD.minZ + margin && point.z <= WORLD.maxZ - margin;
  if (!withinWorld) return false;

  const inWorkshop = point.x <= ROOM.maxX - margin &&
    point.z >= ROOM.minZ + margin && point.z <= ROOM.maxZ - margin;
  const inDoorway = point.x > ROOM.maxX - margin && point.x < ROOM.maxX + 1.25 &&
    point.z >= DOOR.minZ + radius && point.z <= DOOR.maxZ - radius;
  const outdoors = point.x >= ROOM.maxX + 1.15;
  const onWalkableGround = inWorkshop || inDoorway || outdoors;

  return onWalkableGround &&
    !pointHitsFurniture(point, null, radius) &&
    !pointHitsTree(point, radius);
}

function canSantaStandAt(point) {
  return canCharacterStandAt(point, santaCollisionRadius);
}

function canElfStandAt(point) {
  return canCharacterStandAt(point, elfCollisionRadius);
}

function makeFootprintHelper(root) {
  const fp = getRotatedFootprint(root);
  const helper = new THREE.Group();
  helper.renderOrder = 3000;

  const footprint = new THREE.Mesh(
    new THREE.PlaneGeometry(fp.x + 0.7, fp.z + 0.7),
    matFootprint
  );
  footprint.rotation.x = -Math.PI / 2;
  footprint.position.y = 0.075;
  footprint.renderOrder = 3000;
  helper.add(footprint);

  const hx = (fp.x + 0.82) / 2;
  const hz = (fp.z + 0.82) / 2;
  const points = [
    new THREE.Vector3(-hx, 0.09, -hz),
    new THREE.Vector3(hx, 0.09, -hz),
    new THREE.Vector3(hx, 0.09, -hz),
    new THREE.Vector3(hx, 0.09, hz),
    new THREE.Vector3(hx, 0.09, hz),
    new THREE.Vector3(-hx, 0.09, hz),
    new THREE.Vector3(-hx, 0.09, hz),
    new THREE.Vector3(-hx, 0.09, -hz)
  ];
  const outline = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(points), matFootprintLine);
  outline.renderOrder = 3001;
  helper.add(outline);

  const cornerSize = 0.42;
  const corners = [
    [-hx, -hz], [hx, -hz], [hx, hz], [-hx, hz]
  ];
  for (const [x, z] of corners) {
    const marker = box('footprint-corner', { x: cornerSize, y: 0.12, z: cornerSize }, { x, y: 0.12, z }, matSelection, helper, false, false);
    marker.renderOrder = 3002;
  }

  scene.add(helper);
  return helper;
}

function setFurniturePreviewMaterials(root, isMoving) {
  if (isMoving) {
    selectedOriginalMaterials = [];
    root.traverse(obj => {
      if (!obj.isMesh) return;
      selectedOriginalMaterials.push([obj, obj.material]);
      const cached = movingMaterialCache.get(obj.material.uuid);
      if (cached) {
        obj.material = cached;
      } else {
        const clone = obj.material.clone();
        clone.transparent = true;
        clone.opacity = 0.68;
        clone.depthWrite = false;
        movingMaterialCache.set(obj.material.uuid, clone);
        obj.material = clone;
      }
      obj.castShadow = false;
    });
    return;
  }

  if (selectedOriginalMaterials) {
    for (const [obj, material] of selectedOriginalMaterials) {
      obj.material = material;
      obj.castShadow = true;
    }
  }
  selectedOriginalMaterials = null;
}

function clearArrowKeyState() {
  keyState.ArrowUp = false;
  keyState.ArrowDown = false;
  keyState.ArrowLeft = false;
  keyState.ArrowRight = false;
}

function beginFurnitureMove(root) {
  clearArrowKeyState();
  selectedFurniture = root;
  selectedOriginalPosition = root.position.clone();
  selectedOriginalRotationY = root.rotation.y;
  setFurniturePreviewMaterials(root, true);
  footprintHelper = makeFootprintHelper(root);
  const point = currentGroundPoint() || root.position.clone();
  updateMovingFurniture(point);
}

function updateMovingFurniture(point) {
  if (!selectedFurniture || !point) return;
  const p = clampFurniturePoint(selectedFurniture, point);
  selectedFurniture.position.x = p.x;
  selectedFurniture.position.z = p.z;

  if (footprintHelper) {
    footprintHelper.position.set(p.x, 0, p.z);
    footprintHelper.rotation.y = selectedFurniture.rotation.y;
  }

  selectionRing.visible = true;
  selectionRing.position.set(p.x, 0.045, p.z);
  const ringScale = Math.max(1.4, (selectedFurniture.userData.radius || 2) * 0.48);
  selectionRing.scale.set(ringScale, ringScale, ringScale);
}

function finishFurnitureMove(point) {
  if (!selectedFurniture) return;
  updateMovingFurniture(point || currentGroundPoint() || selectedFurniture.position);
  setFurniturePreviewMaterials(selectedFurniture, false);

  if (footprintHelper) {
    scene.remove(footprintHelper);
    footprintHelper.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
    });
    footprintHelper = null;
  }

  if (!canSantaStandAt(santa.position)) {
    santa.position.copy(nearestFreePoint(santa.position));
    santaTarget.copy(santa.position);
  }

  selectedFurniture = null;
  selectedOriginalPosition = null;
  selectionRing.visible = false;
}

function rotateFurniture() {
  if (!selectedFurniture) return;
  selectedFurniture.rotation.y += Math.PI / 2;
  updateMovingFurniture(currentGroundPoint() || selectedFurniture.position);
}

function cancelFurnitureMove() {
  if (!selectedFurniture) return;
  selectedFurniture.position.copy(selectedOriginalPosition);
  selectedFurniture.rotation.y = selectedOriginalRotationY;
  setFurniturePreviewMaterials(selectedFurniture, false);
  if (footprintHelper) {
    scene.remove(footprintHelper);
    footprintHelper = null;
  }
  selectedFurniture = null;
  selectionRing.visible = false;
}

function pickFurnitureAtPointer(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(furnitureMeshes, true);
  if (!hits.length) return null;
  return hits[0].object.userData.furnitureRoot || null;
}

function isPointerOverFurniture(clientX, clientY) {
  return !!pickFurnitureAtPointer(clientX, clientY);
}

function pickTreeAtPointer(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObjects(treeMeshes, false).find(result =>
    result.object.userData.treeRoot?.visible && !result.object.userData.treeRoot.userData.falling
  );
  return hit?.object.userData.treeRoot || null;
}

function nearestTreeToSanta(maxDistance = 2.65) {
  let nearest = null;
  let nearestDistance = maxDistance;
  for (const tree of treeRoots) {
    if (!tree.visible || tree.userData.falling) continue;
    const distance = santa.position.distanceTo(tree.position);
    if (distance < nearestDistance) {
      nearest = tree;
      nearestDistance = distance;
    }
  }
  return nearest;
}

function targetTree(tree) {
  activeTree = tree;
  treeTargetRing.visible = true;
  treeTargetRing.position.x = tree.position.x;
  treeTargetRing.position.z = tree.position.z;
  const away = santa.position.clone().sub(tree.position).setY(0);
  if (away.lengthSq() < 0.01) away.set(-1, 0, 0);
  away.normalize();
  santaTarget.copy(tree.position).addScaledVector(away, tree.userData.radius + 1.35);
  santaTarget.copy(clampToWorld(santaTarget, 0.8));
}

function leaveStump(tree) {
  const scale = tree.userData.radius / 0.72;
  const stump = new THREE.Group();
  stump.position.copy(tree.position);
  const bark = new THREE.Mesh(new THREE.CylinderGeometry(0.46 * scale, 0.54 * scale, 0.42, 8), matTreeTrunk);
  bark.position.y = 0.21;
  bark.castShadow = true;
  bark.receiveShadow = true;
  stump.add(bark);
  const cut = new THREE.Mesh(new THREE.CylinderGeometry(0.4 * scale, 0.4 * scale, 0.035, 12), matTreeCut);
  cut.position.y = 0.43;
  cut.castShadow = true;
  stump.add(cut);
  scene.add(stump);
}

function addWood(amount) {
  woodCount += amount;
  woodCountElement.textContent = woodCount;
  updateBuildAffordability();
  woodCountElement.animate(
    [{ transform: 'scale(1)' }, { transform: 'scale(1.45)', color: '#1c9a5a' }, { transform: 'scale(1)' }],
    { duration: 420, easing: 'ease-out' }
  );
}

function chopTree(tree) {
  if (!tree || tree.userData.falling || chopCooldown > 0) return;
  if (santa.position.distanceTo(tree.position) > 2.75) {
    targetTree(tree);
    return;
  }

  activeTree = tree;
  chopCooldown = 0.42;
  axeSwing = 1;
  santaFacingAngle = Math.atan2(tree.position.x - santa.position.x, tree.position.z - santa.position.z);
  santa.rotation.y = santaFacingAngle;
  tree.userData.health -= 1;
  tree.scale.multiplyScalar(0.96);

  if (tree.userData.health <= 0) {
    tree.userData.falling = true;
    tree.userData.fallProgress = 0;
    tree.userData.fallDirection = Math.atan2(tree.position.x - santa.position.x, tree.position.z - santa.position.z) + Math.PI;
    leaveStump(tree);
    addWood(tree.userData.wood);
    activeTree = null;
    treeTargetRing.visible = false;
  }
}

function performChopAction() {
  const tree = activeTree && !activeTree.userData.falling ? activeTree : nearestTreeToSanta();
  if (tree) chopTree(tree);
}

function updateTreeInteraction(dt) {
  chopCooldown = Math.max(0, chopCooldown - dt);
  axeSwing = Math.max(0, axeSwing - dt * 3.5);

  for (const tree of treeRoots) {
    if (!tree.userData.falling) continue;
    tree.userData.fallProgress = Math.min(1, tree.userData.fallProgress + dt * 1.35);
    const eased = 1 - Math.pow(1 - tree.userData.fallProgress, 3);
    tree.rotation.z = Math.cos(tree.userData.fallDirection) * eased * Math.PI * 0.48;
    tree.rotation.x = Math.sin(tree.userData.fallDirection) * eased * Math.PI * 0.48;
    if (tree.userData.fallProgress >= 1) tree.visible = false;
  }

  const nearbyTree = nearestTreeToSanta();
  actionHint.classList.toggle('visible', !!nearbyTree);
  if (activeTree && (activeTree.userData.falling || !activeTree.visible)) {
    activeTree = null;
    treeTargetRing.visible = false;
  }
}

function handlePointerMove(ev) {
  setPointer(ev);
  const point = currentGroundPoint();
  if (selectedFurniture) {
    updateMovingFurniture(point);
    renderer.domElement.style.cursor = 'grabbing';
  } else {
    const interactive = pickTreeAtPointer(lastPointerClientX, lastPointerClientY) ||
      isPointerOverFurniture(lastPointerClientX, lastPointerClientY);
    renderer.domElement.style.cursor = interactive ? 'pointer' : 'default';
  }
}

function handlePointerDown(ev) {
  setPointer(ev);

  if (ev.button === 2) {
    ev.preventDefault();
    rotateFurniture();
    return;
  }

  if (ev.button !== 0) return;
  const point = currentGroundPoint();

  if (selectedFurniture) {
    finishFurnitureMove(point);
    return;
  }

  const tree = pickTreeAtPointer(lastPointerClientX, lastPointerClientY);
  if (tree) {
    targetTree(tree);
    if (santa.position.distanceTo(tree.position) <= 2.75) chopTree(tree);
    return;
  }

  const root = pickFurnitureAtPointer(lastPointerClientX, lastPointerClientY);
  if (root) {
    beginFurnitureMove(root);
    return;
  }

  if (point) {
    activeTree = null;
    treeTargetRing.visible = false;
    santaTarget.copy(clampToWorld(point, 0.85));
  }
}

renderer.domElement.addEventListener('pointermove', handlePointerMove);
document.addEventListener('pointermove', handlePointerMove);
renderer.domElement.addEventListener('mousemove', handlePointerMove);
document.addEventListener('mousemove', handlePointerMove);
renderer.domElement.addEventListener('pointerdown', handlePointerDown);
document.addEventListener('contextmenu', ev => ev.preventDefault());

document.addEventListener('keydown', ev => {
  if ((ev.key === 'e' || ev.key === 'E' || ev.code === 'Space') && !selectedFurniture) {
    ev.preventDefault();
    if (!ev.repeat) performChopAction();
    return;
  }

  if (ev.key in keyState) {
    ev.preventDefault();

    // Mientras colocas un mueble, las flechas no mueven a Papá Noel:
    // rotan el mueble 90º una sola vez por pulsación.
    if (selectedFurniture) {
      if (!ev.repeat) rotateFurniture();
      return;
    }

    keyState[ev.key] = true;
  } else if (ev.key === 'Escape') {
    cancelFurnitureMove();
  }
});

document.addEventListener('keyup', ev => {
  if (ev.key in keyState) {
    ev.preventDefault();
    keyState[ev.key] = false;
  }
});

function keyboardDirection() {
  const direction = new THREE.Vector3(0, 0, 0);
  if (keyState.ArrowUp) direction.z -= 1;
  if (keyState.ArrowDown) direction.z += 1;
  if (keyState.ArrowLeft) direction.x -= 1;
  if (keyState.ArrowRight) direction.x += 1;
  return direction;
}

function moveSantaWithCollision(direction, step) {
  if (direction.lengthSq() < 0.000001 || step <= 0) return false;
  direction.normalize();
  const previousPosition = santa.position.clone();
  const next = previousPosition.clone().addScaledVector(direction, step);
  next.y = 0;

  if (canSantaStandAt(next)) {
    santa.position.copy(next);
  } else {
    const slideX = new THREE.Vector3(next.x, 0, previousPosition.z);
    const slideZ = new THREE.Vector3(previousPosition.x, 0, next.z);

    if (canSantaStandAt(slideX)) {
      santa.position.copy(slideX);
    } else if (canSantaStandAt(slideZ)) {
      santa.position.copy(slideZ);
    } else {
      santaTarget.copy(previousPosition);
      return false;
    }
  }

  // La orientación depende del desplazamiento real. Así, una colisión, un vector
  // residual del destino o el estado de reposo nunca hacen que Santa se dé la vuelta.
  const actualMovement = santa.position.clone().sub(previousPosition);
  actualMovement.y = 0;
  if (actualMovement.lengthSq() > 0.000001) {
    santaFacingAngle = Math.atan2(actualMovement.x, actualMovement.z);
    santa.rotation.y = santaFacingAngle;
    return true;
  }

  santa.rotation.y = santaFacingAngle;
  return false;
}

function updateSantaAnimation(dt, isMoving) {
  const actionStrength = axeSwing > 0 ? Math.sin(axeSwing * Math.PI) : 0;
  const blend = 1 - Math.exp(-dt * 14);

  if (isMoving && actionStrength === 0) santaWalkCycle += dt * 11;
  const stride = isMoving && actionStrength === 0 ? Math.sin(santaWalkCycle) : 0;
  const stepLiftLeft = Math.max(0, stride) * 0.12;
  const stepLiftRight = Math.max(0, -stride) * 0.12;

  santaLeftLeg.rotation.x = THREE.MathUtils.lerp(santaLeftLeg.rotation.x, stride * 0.38, blend);
  santaRightLeg.rotation.x = THREE.MathUtils.lerp(santaRightLeg.rotation.x, -stride * 0.38, blend);
  santaLeftBoot.rotation.x = THREE.MathUtils.lerp(santaLeftBoot.rotation.x, stride * 0.28, blend);
  santaRightBoot.rotation.x = THREE.MathUtils.lerp(santaRightBoot.rotation.x, -stride * 0.28, blend);
  santaLeftLeg.position.y = THREE.MathUtils.lerp(santaLeftLeg.position.y, santaPose.leftLegY + stepLiftLeft, blend);
  santaRightLeg.position.y = THREE.MathUtils.lerp(santaRightLeg.position.y, santaPose.rightLegY + stepLiftRight, blend);
  santaLeftBoot.position.y = THREE.MathUtils.lerp(santaLeftBoot.position.y, santaPose.leftBootY + stepLiftLeft, blend);
  santaRightBoot.position.y = THREE.MathUtils.lerp(santaRightBoot.position.y, santaPose.rightBootY + stepLiftRight, blend);

  const walkArmSwing = stride * 0.42;
  const chopWindup = actionStrength * 1.05;
  santaLeftArm.rotation.x = THREE.MathUtils.lerp(santaLeftArm.rotation.x, -walkArmSwing + chopWindup * 0.35, blend);
  santaRightArm.rotation.x = THREE.MathUtils.lerp(santaRightArm.rotation.x, walkArmSwing - chopWindup, blend);
  santaLeftArm.rotation.z = THREE.MathUtils.lerp(santaLeftArm.rotation.z, santaPose.leftArmZ - actionStrength * 0.18, blend);
  santaRightArm.rotation.z = THREE.MathUtils.lerp(santaRightArm.rotation.z, santaPose.rightArmZ + actionStrength * 0.28, blend);
  santaLeftMitten.position.y = THREE.MathUtils.lerp(santaLeftMitten.position.y, santaPose.leftMittenY + actionStrength * 0.32, blend);
  santaRightMitten.position.y = THREE.MathUtils.lerp(santaRightMitten.position.y, santaPose.rightMittenY + actionStrength * 0.58, blend);
  santaLeftMitten.position.z = THREE.MathUtils.lerp(santaLeftMitten.position.z, santaPose.leftMittenZ - walkArmSwing * 0.3, blend);
  santaRightMitten.position.z = THREE.MathUtils.lerp(santaRightMitten.position.z, santaPose.rightMittenZ + walkArmSwing * 0.3 + actionStrength * 0.18, blend);

  santaAxe.rotation.x = THREE.MathUtils.lerp(santaAxe.rotation.x, -actionStrength * 0.75, blend);
  santaAxe.rotation.z = THREE.MathUtils.lerp(santaAxe.rotation.z, -0.35 - actionStrength * 1.35, blend);
  santa.rotation.y = santaFacingAngle;
}

function updateSantaMovement(dt) {
  const keyDirection = keyboardDirection();
  let santaMoved = false;
  if (keyDirection.lengthSq() > 0) {
    santaMoved = moveSantaWithCollision(keyDirection, dt * santaSpeed);
    // El destino debe quedar en la posición alcanzada, no en la del fotograma
    // anterior. De lo contrario, al soltar la tecla Santa retrocede un paso y
    // termina mirando exactamente en la dirección contraria.
    santaTarget.copy(santa.position);
  } else {
    const direction = santaTarget.clone().sub(santa.position);
    direction.y = 0;
    const distance = direction.length();
    if (distance > 0.04) {
      santaMoved = moveSantaWithCollision(direction, Math.min(distance, dt * santaSpeed));
    } else {
      // Elimina los pequeños vectores residuales del destino sin tocar la orientación.
      santaTarget.copy(santa.position);
      santa.rotation.y = santaFacingAngle;
    }
  }
  return santaMoved;
}

function moveElfWithCollision(target, step) {
  const direction = target.clone().sub(elf.position);
  direction.y = 0;
  const distance = direction.length();
  if (distance < 0.05) return;

  direction.normalize();
  const next = elf.position.clone().addScaledVector(direction, Math.min(distance, step));
  next.y = 0;

  if (canElfStandAt(next)) {
    elf.position.copy(next);
  } else {
    const slideX = new THREE.Vector3(next.x, 0, elf.position.z);
    const slideZ = new THREE.Vector3(elf.position.x, 0, next.z);

    if (canElfStandAt(slideX)) {
      elf.position.x = slideX.x;
    } else if (canElfStandAt(slideZ)) {
      elf.position.z = slideZ.z;
    }
  }

  elf.rotation.y = Math.atan2(direction.x, direction.z);
}

function updateElfFollower(dt) {
  const forward = new THREE.Vector3(Math.sin(santa.rotation.y), 0, Math.cos(santa.rotation.y));
  const right = new THREE.Vector3(forward.z, 0, -forward.x);
  let desired = santa.position.clone()
    .addScaledVector(forward, -1.45)
    .addScaledVector(right, 0.95);
  desired = clampToWorld(desired, 0.8);

  if (!canElfStandAt(desired)) {
    desired = santa.position.clone().addScaledVector(forward, -1.85);
    desired = clampToWorld(desired, 0.8);
  }

  if (!canElfStandAt(desired)) {
    desired = nearestFreePoint(santa.position.clone().addScaledVector(forward, -2.1));
  }

  const distanceToSanta = elf.position.distanceTo(santa.position);
  if (distanceToSanta > 1.15) {
    moveElfWithCollision(desired, dt * elfSpeed);
  }
}

const cameraFocus = new THREE.Vector3(0, 0, 1.5);

function updateCamera(dt) {
  const outdoors = santa.position.x > 10;
  const desiredX = outdoors ? THREE.MathUtils.clamp(santa.position.x, 0, WORLD.maxX - 12) : 0;
  const desiredZ = outdoors ? THREE.MathUtils.clamp(santa.position.z, WORLD.minZ + 12, WORLD.maxZ - 12) : 1.5;
  const smoothing = 1 - Math.exp(-dt * 3.2);
  cameraFocus.x = THREE.MathUtils.lerp(cameraFocus.x, desiredX, smoothing);
  cameraFocus.z = THREE.MathUtils.lerp(cameraFocus.z, desiredZ, smoothing);
  camera.position.set(cameraFocus.x, 38, cameraFocus.z + 31);
  camera.lookAt(cameraFocus.x, 0, cameraFocus.z);

  dir.position.set(cameraFocus.x - 10, 22, cameraFocus.z + 14);
  dir.target.position.set(cameraFocus.x, 0, cameraFocus.z);
  dir.target.updateMatrixWorld();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (selectedFurniture) {
    updateMovingFurniture(currentGroundPoint());
  }

  const santaMoved = updateSantaMovement(dt);

  updateElfFollower(dt);
  updateTreeInteraction(dt);
  updateSantaAnimation(dt, santaMoved);
  updateCamera(dt);

  renderer.render(scene, camera);
  if (inventoryOpen) renderInventory();
}
animate();

function onResize() {
  const w = Math.max(1, gameHost.clientWidth);
  const h = Math.max(1, gameHost.clientHeight);
  const aspect = w / h;
  const viewHeight = 36;
  camera.left = -viewHeight * aspect / 2;
  camera.right = viewHeight * aspect / 2;
  camera.top = viewHeight / 2;
  camera.bottom = -viewHeight / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  resizeInventoryRenderer();
}
window.addEventListener('resize', onResize);
onResize();

window.__fabricaDebug = {
  scene,
  camera,
  renderer,
  furnitureRoots,
  get selectedFurniture() { return selectedFurniture; },
  currentGroundPoint,
  updateMovingFurniture,
  placeNewFurnitureInMoveMode,
  treeRoots,
  get woodCount() { return woodCount; },
  chopTree,
  targetTree,
  addWood,
  get santaForwardAxis() { return santa.userData.forwardAxis; },
  get buildCosts() { return { ...BUILD_COSTS }; }
};
</script>
